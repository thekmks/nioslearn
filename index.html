<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f6f6a" />
  <title>NiosLearn</title>
  <style>
    :root {
      color-scheme: light;
      --shell-bg: #eaf8f6;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--shell-bg);
    }

    body {
      position: fixed;
      inset: 0;
    }

    .app-frame-shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 0%, rgba(127, 223, 215, 0.35), transparent 22rem),
        linear-gradient(135deg, #eaf8f6, #f8fffe);
    }

    .app-frame-stage,
    .app-frame-scale {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #ffffff;
    }

  </style>
</head>
<body>
  <main class="app-frame-shell" id="shell">
    <div class="app-frame-stage" id="stage">
      <div class="app-frame-scale" id="scaleWrap">
        <iframe
          id="niosFrame"
          src="https://niosui-122632876591.asia-south1.run.app"
          title="NiosLearn app"
          allow="clipboard-read; clipboard-write; microphone; camera; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
          scrolling="no"
        ></iframe>
      </div>
    </div>
  </main>
</body>
</html>
