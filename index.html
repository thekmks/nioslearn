<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f6f6a" />
  <title>NiosLearn</title>
  <style>
    :root {
      color-scheme: light;
      --shell-bg: #eaf8f6;
      --control-bg: rgba(255, 255, 255, 0.92);
      --control-border: rgba(132, 190, 184, 0.76);
      --ink: #123936;
      --accent: #1677c8;
      --accent-2: #20b2aa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--shell-bg);
    }

    body {
      position: fixed;
      inset: 0;
    }

    .app-frame-shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 0%, rgba(127, 223, 215, 0.35), transparent 22rem),
        linear-gradient(135deg, #eaf8f6, #f8fffe);
    }

    .app-frame-stage {
      position: absolute;
      inset: 0;
      overflow: auto;
      overscroll-behavior: contain;
      background: #ffffff;
    }

    .app-frame-scale {
      width: 100%;
      height: 100%;
      transform-origin: top left;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .frame-controls-drawer {
      position: fixed;
      z-index: 10;
      top: max(0px, env(safe-area-inset-top));
      left: 50%;
      display: grid;
      justify-items: center;
      transform: translate(-50%, calc(-100% + 28px));
      transition: transform 180ms ease;
    }

    .frame-controls-drawer.dragging {
      transition: none;
    }

    .frame-controls-drawer.open {
      transform: translate(-50%, 0);
    }

    .frame-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--control-border);
      border-top: 0;
      border-radius: 0 0 18px 18px;
      padding: 6px;
      background: var(--control-bg);
      box-shadow: 0 14px 34px rgba(0, 80, 70, 0.18);
      backdrop-filter: blur(14px);
    }

    .controls-pull {
      display: grid;
      place-items: center;
      width: 44px;
      height: 28px;
      margin-top: -1px;
      border: 1px solid var(--control-border);
      border-top: 0;
      border-radius: 0 0 8px 8px;
      padding: 0;
      background: var(--control-bg);
      color: var(--ink);
      cursor: grab;
      touch-action: none;
      user-select: none;
      box-shadow: 0 12px 28px rgba(0, 80, 70, 0.16);
      backdrop-filter: blur(14px);
      transition: color 140ms ease, background 140ms ease;
    }

    .controls-pull:hover {
      color: var(--accent);
      background: #ffffff;
    }

    .controls-pull:active {
      cursor: grabbing;
    }

    .controls-pull svg {
      transition: transform 180ms ease;
    }

    .frame-controls-drawer.open .controls-pull svg {
      transform: rotate(180deg);
    }

    .frame-controls button,
    .frame-controls a {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(132, 190, 184, 0.58);
      border-radius: 999px;
      padding: 0;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      transition: transform 140ms ease, border-color 140ms ease, color 140ms ease, background 140ms ease;
    }

    .frame-controls button:hover,
    .frame-controls a:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .frame-controls button:active,
    .frame-controls a:active {
      transform: translateY(0);
    }

    .fullscreen-control.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #eef8ff;
    }

    .close-control {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important;
      color: #ffffff !important;
      border-color: transparent !important;
    }

    .closed-state {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: #eaf8f6;
    }

    .closed-state.visible {
      display: grid;
    }

    .closed-state button {
      border: 1px solid rgba(132, 190, 184, 0.76);
      border-radius: 999px;
      padding: 12px 18px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 14px 34px rgba(0, 80, 70, 0.14);
    }

    @media (max-width: 640px) {
      .frame-controls-drawer {
        transform: translate(-50%, calc(-100% + 26px));
      }

      .frame-controls {
        gap: 5px;
        padding: 5px;
      }

      .controls-pull {
        width: 42px;
        height: 26px;
      }

      .frame-controls button,
      .frame-controls a {
        width: 32px;
        height: 32px;
      }

    }
  </style>
</head>
<body>
  <main class="app-frame-shell" id="shell">
    <div class="app-frame-stage" id="stage">
      <div class="app-frame-scale" id="scaleWrap">
        <iframe
          id="niosFrame"
          src="https://niosui-122632876591.asia-south1.run.app"
          title="NiosLearn app"
          allow="clipboard-read; clipboard-write; microphone; camera; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </div>

    <div class="frame-controls-drawer" id="controlsDrawer">
      <nav class="frame-controls" aria-label="NiosLearn iframe controls">
        <button type="button" class="fullscreen-control" id="fullscreenFrame" aria-label="Show full screen" title="Show full screen">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
            <path fill="currentColor" d="M5 5h6v2H8.41l3.3 3.29-1.42 1.42L7 8.41V11H5V5Zm8 0h6v6h-2V8.41l-3.29 3.3-1.42-1.42L15.59 7H13V5ZM7 15.59l3.29-3.3 1.42 1.42L8.41 17H11v2H5v-6h2v2.59Zm9.59 1.41-3.3-3.29 1.42-1.42 3.29 3.3V13h2v6h-6v-2h2.59Z" />
          </svg>
        </button>
        <button type="button" class="close-control" id="closeFrame" aria-label="Close app frame" title="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="m12 10.59 5.3-5.3 1.41 1.42-5.3 5.29 5.3 5.3-1.42 1.41-5.29-5.3-5.3 5.3-1.41-1.42 5.3-5.29-5.3-5.3L6.7 5.3z" /></svg>
        </button>
      </nav>
      <button type="button" class="controls-pull" id="controlsPull" aria-label="Show frame controls" aria-expanded="false" title="Show frame controls">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z" />
        </svg>
      </button>
    </div>
  </main>

  <section class="closed-state" id="closedState" aria-label="NiosLearn frame closed">
    <button type="button" id="reopenFrame">Open NiosLearn</button>
  </section>

  <script>
    const shell = document.getElementById("shell");
    const closedState = document.getElementById("closedState");
    const controlsDrawer = document.getElementById("controlsDrawer");
    const controlsPull = document.getElementById("controlsPull");
    const drawerPositionKey = "niosControlsDrawerLeft";
    let drawerDrag = null;
    let ignoreNextPullClick = false;

    function clampDrawerLeft(left) {
      const margin = 8;
      const halfWidth = controlsDrawer.offsetWidth / 2;
      const min = halfWidth + margin;
      const max = window.innerWidth - halfWidth - margin;
      if (max < min) return window.innerWidth / 2;
      return Math.min(max, Math.max(min, left));
    }

    function setDrawerLeft(left) {
      const clamped = clampDrawerLeft(left);
      controlsDrawer.style.left = `${clamped}px`;
      sessionStorage.setItem(drawerPositionKey, String(clamped));
    }

    function restoreDrawerPosition() {
      const savedLeft = Number(sessionStorage.getItem(drawerPositionKey));
      setDrawerLeft(Number.isFinite(savedLeft) ? savedLeft : window.innerWidth / 2);
    }

    function setControlsOpen(open) {
      controlsDrawer.classList.toggle("open", open);
      controlsPull.setAttribute("aria-expanded", String(open));
      controlsPull.setAttribute("aria-label", open ? "Hide frame controls" : "Show frame controls");
      controlsPull.title = open ? "Hide frame controls" : "Show frame controls";
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (shell.requestFullscreen) {
          await shell.requestFullscreen();
        }
      } catch (error) {
        console.warn("Fullscreen request was not completed", error);
      }
    }

    function syncFullscreenButton() {
      const button = document.getElementById("fullscreenFrame");
      const full = Boolean(document.fullscreenElement);
      button.classList.toggle("active", full);
      button.setAttribute("aria-label", full ? "Exit full screen" : "Show full screen");
      button.title = full ? "Exit full screen" : "Show full screen";
    }

    document.getElementById("fullscreenFrame").addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", syncFullscreenButton);
    controlsPull.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;

      const rect = controlsDrawer.getBoundingClientRect();
      drawerDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startLeft: rect.left + rect.width / 2,
        moved: false,
      };
      controlsDrawer.classList.add("dragging");
      controlsPull.setPointerCapture(event.pointerId);
    });
    controlsPull.addEventListener("pointermove", (event) => {
      if (!drawerDrag || event.pointerId !== drawerDrag.pointerId) return;

      const deltaX = event.clientX - drawerDrag.startX;
      if (Math.abs(deltaX) > 4) drawerDrag.moved = true;
      setDrawerLeft(drawerDrag.startLeft + deltaX);
      event.preventDefault();
    });
    controlsPull.addEventListener("pointerup", (event) => {
      if (!drawerDrag || event.pointerId !== drawerDrag.pointerId) return;

      ignoreNextPullClick = drawerDrag.moved;
      drawerDrag = null;
      controlsDrawer.classList.remove("dragging");
      controlsPull.releasePointerCapture(event.pointerId);
    });
    controlsPull.addEventListener("pointercancel", (event) => {
      if (!drawerDrag || event.pointerId !== drawerDrag.pointerId) return;

      drawerDrag = null;
      controlsDrawer.classList.remove("dragging");
      controlsPull.releasePointerCapture(event.pointerId);
    });
    controlsPull.addEventListener("click", (event) => {
      if (ignoreNextPullClick) {
        ignoreNextPullClick = false;
        event.preventDefault();
        return;
      }

      setControlsOpen(!controlsDrawer.classList.contains("open"));
    });
    window.addEventListener("resize", () => {
      const rect = controlsDrawer.getBoundingClientRect();
      setDrawerLeft(rect.left + rect.width / 2);
    });
    document.getElementById("closeFrame").addEventListener("click", () => {
      shell.hidden = true;
      closedState.classList.add("visible");
    });
    document.getElementById("reopenFrame").addEventListener("click", () => {
      shell.hidden = false;
      closedState.classList.remove("visible");
    });

    restoreDrawerPosition();
    syncFullscreenButton();
  </script>
</body>
</html>
